# Hooks invoke make → Docker only (no host cargo).
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt (container)
        entry: make fmt-check
        language: system
        pass_filenames: false
      - id: clippy
        name: clippy (container)
        entry: make clippy
        language: system
        pass_filenames: false
      - id: nextest
        name: nextest full (container)
        entry: make test
        language: system
        pass_filenames: false
        stages: [pre-push]
