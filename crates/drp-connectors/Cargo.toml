[package]
name = "drp-connectors"
description = "Data source connectors and connector plugin framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
drp-common.workspace = true
drp-core.workspace = true
async-trait.workspace = true
indexmap.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
tokio = { workspace = true }
csv.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "chrono"] }
parquet = { version = "54", default-features = false, features = ["arrow", "snap", "zstd"] }
arrow-array = "54"
arrow-schema = "54"
arrow-cast = "54"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs"] }
tempfile.workspace = true
pretty_assertions.workspace = true
