name: CI

# Container-first: the GitHub runner only needs Docker.
# No rustup / cargo on the runner host.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Doctor (Docker only)
        run: make doctor

      - name: Build toolchain image
        run: docker-compose build dev

      - name: Start infrastructure
        run: docker-compose up -d postgres redis minio minio-init

      - name: rustfmt (container)
        run: make fmt-check

      - name: clippy (container)
        run: make clippy

      - name: test (container)
        run: make test

      - name: build (container)
        run: make build

      - name: docs (container)
        run: make doc

  image-smoke:
    name: API image smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build production API image
        run: docker-compose build api

      - name: Start stack
        run: docker-compose up -d postgres redis minio minio-init api

      - name: Wait for readiness
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/readyz; then
              echo
              curl -fsS http://127.0.0.1:8080/livez
              echo
              curl -fsS http://127.0.0.1:8080/metrics | head -20
              exit 0
            fi
            sleep 3
          done
          docker-compose logs api
          exit 1

      - name: Teardown
        if: always()
        run: docker-compose down -v --remove-orphans

  quality-teardown:
    name: Teardown quality job
    runs-on: ubuntu-latest
    needs: quality
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Teardown
        run: docker-compose down -v --remove-orphans || true
