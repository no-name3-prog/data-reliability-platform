name: CI

# Container-first CI. Runner has Docker Engine + Compose V2 plugin only.
# Do NOT use standalone `docker-compose` (missing on ubuntu-latest).
# Pipeline mirrors local `make verify` + image smoke.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Lint · Unit · Integration · Regression · Build · Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker / Compose versions
        run: |
          docker version
          docker compose version

      - name: Doctor (Docker only)
        run: make doctor

      - name: Build toolchain image (Rust + clippy + rustfmt + nextest)
        run: make bootstrap-image

      - name: Start infrastructure (postgres, redis, minio)
        run: make infra

      - name: Wait for infrastructure healthy
        run: make wait-infra

      - name: Format check (container)
        run: make fmt-check

      - name: Clippy (container)
        run: make clippy

      - name: Unit tests — nextest profile unit (container)
        run: make test-unit

      - name: Integration tests — nextest profile integration (container)
        run: make test-integration

      - name: Regression tests — nextest profile regression (container)
        run: make test-regression

      - name: Full nextest CI profile (container)
        run: make test

      - name: Build workspace (container)
        run: make build

      - name: Documentation (container)
        run: make doc

      - name: Tooling config presence
        run: make editorconfig-check

      - name: Teardown
        if: always()
        run: make down-volumes || true

  image-smoke:
    name: API image smoke (compose)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Show Docker / Compose versions
        run: |
          docker version
          docker compose version

      - name: Build API image
        run: make api-build

      - name: Start stack (api + infra)
        run: make smoke-up

      - name: Probe livez / readyz / metrics
        run: make smoke-probe

      - name: Teardown
        if: always()
        run: make down-volumes || true
